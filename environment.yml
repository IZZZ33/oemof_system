name: oemof-system

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      # User interface and maps
      - streamlit==1.44.1
      - streamlit-folium==0.25.3
      - folium==0.20.0
      - branca==0.8.2
      - osmnx==1.3.0
      - geopandas==0.12.2
      - geopy==2.4.1
      - pyproj==3.4.1
      - shapely==2.0.1

      # Data, spreadsheets, and calculations
      - numpy==1.24.2
      - scipy==1.15.3
      - pandas==2.2.3
      - openpyxl==3.1.0
      - xlsxwriter==3.0.9
      - filelock==3.18.0
      - python-dateutil==2.9.0.post0

      # Building and demand estimation
      - demandlib==0.1.8
      - OpenDHW==0.2.8
      - teaser==1.1.0

      # Energy-system optimization
      - oemof.network==0.5.0a1
      - oemof.solph==0.5.0
      - oemof.tools==0.4.2
      # oemof.solph 0.5 requires Pyomo >=6,<7. Version 6.8.1+ is also
      # required for gurobi_direct compatibility with Gurobi 12.
      - Pyomo==6.8.2
      - networkx==3.0

      # Results and charts
      - matplotlib==3.7.0
      - plotly==6.1.0
      - seaborn==0.13.2

# Gurobi is required for optimization but is intentionally installed
# separately so its version, distribution channel, and license configuration
# can be managed explicitly.
